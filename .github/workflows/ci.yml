# The host tests need nothing but a C compiler, so they run on a GitHub-hosted
# runner rather than the dev box. These are the tests that must still run when
# that machine is off — tying them to it would undo the point of having them.
#
# Two checkouts, because the obstacle field's Theme comes from the engine and
# the test links magnolia's theme.c directly. The game's Makefile resolves the
# engine at ../../magnolia (beside the repo), so the paths below have to put
# the engine checkout next to the game checkout.
#
# The devkitPPC build below reuses exactly that checkout shape, for the same
# reason. It needs no particular machine either: devkitPro publish the toolchain
# as a container, which is how magnolia has built it on a hosted runner since
# 2026-09-06.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: moonlight-drift

      - name: Check out the engine beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magnolia
          path: magnolia

      # obstacles, player, characters and stars: every module in source/ that
      # is free of libogc. The rules are what a port gets wrong, and they are
      # wrong in ways that look exactly like being right.
      - name: make test
        working-directory: moonlight-drift/wii
        run: make test

  # The simulation, in a job with no engine installed. drift/config.py,
  # projection.py, player.py, obstacles.py, characters.py and stars.py claim to
  # import nothing outside the standard library, a test asserts it, and running
  # them here with nothing but pytest on the machine is what proves it.
  wii-build:
    name: wii build
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      # Checked out into a subdirectory so the engine can sit beside it. That is
      # the layout the Makefile documents and a flat clone produces, so `make`
      # resolves the engine through its own first default candidate rather than
      # a MAGNOLIA= override this job would have to keep correct.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: moonlight-drift

      # Tracks main rather than a pinned ref, deliberately. An engine change
      # that breaks this game should redden this repo on the day it lands.
      - name: Check out the engine beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magnolia
          path: magnolia

      # GRRLIB is not a dkp-pacman package - it is built from source into the
      # portlibs tree, and its own dependencies arrive with the image's
      # ppc-portlibs and wii-portlibs groups. Pinned, so an upstream commit
      # cannot turn this red on a day nobody touched it; v4.6.1 is what
      # magnolia's own CI installs.
      - name: install GRRLIB
        run: |
          git clone --depth 1 --branch v4.6.1 https://github.com/GRRLIB/GRRLIB.git /tmp/grrlib
          make -C /tmp/grrlib/GRRLIB clean all install

      - name: make
        working-directory: moonlight-drift/wii
        run: make

      - name: The .dol exists
        run: test -f moonlight-drift/wii/build/moonlight-drift.dol

  tui-simulation:
    name: tui simulation (no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest ruff

      - name: The world, with no engine on the machine
        working-directory: tui
        run: python -m pytest tests/test_physics.py -q

      - name: Lint
        working-directory: tui
        run: ruff check .

  # The screens, which do need the engine and its terminal backend.
  tui-screens:
    name: tui screens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # magmacrunch comes from pyproject.toml and is on PyPI, so
      # there is nothing to install by hand.
      - name: Install the game
        working-directory: tui
        run: pip install -e ".[dev]"

      - name: Full suite
        working-directory: tui
        run: python -m pytest -q

  # The Roblox version. Three tools, all pinned to the versions in
  # roblox/rokit.toml or beside it, fetched as release zips rather than through
  # rokit so the job has nothing to bootstrap.
  #
  # - lune runs tests/run.luau, the rules with no Roblox on the machine.
  # - rojo builds the place, which is what proves default.project.json maps
  #   every file where the scripts expect to find it.
  # - luau-lsp type-checks all of src/ against Roblox's API definitions, the
  #   only check short of Studio that notices a misspelt property or enum.
  roblox:
    name: roblox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox
    env:
      LUNE: "0.8.9"
      ROJO: "7.4.4"
      LUAU_LSP: "1.70.0"
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          fetch() { curl -sSfL -o "$RUNNER_TEMP/$1.zip" "$2" && unzip -q -o "$RUNNER_TEMP/$1.zip" -d "$RUNNER_TEMP/bin"; }
          fetch lune "https://github.com/lune-org/lune/releases/download/v$LUNE/lune-$LUNE-linux-x86_64.zip"
          fetch rojo "https://github.com/rojo-rbx/rojo/releases/download/v$ROJO/rojo-$ROJO-linux-x86_64.zip"
          fetch luau-lsp "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP/luau-lsp-linux-x86_64.zip"
          curl -sSfL -o "$RUNNER_TEMP/globalTypes.d.luau"             "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/$LUAU_LSP/scripts/globalTypes.d.luau"
          chmod +x "$RUNNER_TEMP"/bin/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Rules
        run: lune run tests/run

      - name: Build the place
        run: rojo build -o "$RUNNER_TEMP/moonlight-drift.rbxl"

      - name: Type check
        run: |
          rojo sourcemap -o "$RUNNER_TEMP/sourcemap.json"
          luau-lsp analyze --platform=roblox             --definitions="$RUNNER_TEMP/globalTypes.d.luau"             --sourcemap="$RUNNER_TEMP/sourcemap.json" src
