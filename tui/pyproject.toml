[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Prefixed for the same reason as magmacrunch-george-boole and
# magmacrunch-thld: PyPI has no scoping like the npm @magmacrunch/… packages.
# See ../../george-boole/tui/PACKAGING.md for the plan this belongs to.
#
# The distribution is namespaced; the import package stays plain `drift`,
# because that is what you type in code and it is not competing for anything.
name = "magmacrunch-moonlight-drift"
version = "0.5.0"
description = "Moonlight Drift — terminal version"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
authors = [{ name = "magmacrunch media" }]

# The engine, with its terminal backend. The simulation in drift/config.py,
# projection.py, player.py, obstacles.py and characters.py depends on neither
# and is importable on its own — tests/test_physics.py runs with nothing but
# pytest on the machine, which is what proves it.
# 0.6.0 is where magmacrunch.engine.ui.glyphs arrived, and this game
# imports it in run(). Resolved against 0.5.0 the install succeeds and the
# game dies on launch, which is the worst place to learn about a pin.
dependencies = ["magmacrunch>=0.6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# Only for regenerating drift/portraits.py from the Wii port's sprite PNGs.
# Not needed to play, to test, or to build the wheel — the generated data is
# committed. See tools/make_portraits.py.
tools = ["pillow>=10.0"]

[project.scripts]
moonlight-drift = "drift.__main__:main"

# Found by a launcher enumerating installed games. Declaring it costs nothing
# when the game is run on its own, and is the whole of what makes it appear in
# an arcade menu - see magmacrunch.engine.arcade.
[project.entry-points."magmacrunch.games"]
moonlight-drift = "drift.arcade:GAME"

[tool.hatch.build.targets.wheel]
packages = ["drift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# drift/portraits.py is generated pixel data, one long row per line. Rewrapping
# it would make it unreadable and the generator would undo it on the next run.
"drift/portraits.py" = ["E501"]
# The tools are development scripts, not part of the wheel.
"tools/*.py" = ["E501"]
